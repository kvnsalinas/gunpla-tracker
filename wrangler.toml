name = "gunpla-tracker"
main = "worker/index.ts"
compatibility_date = "2025-01-15"

# The Worker sees every request first (see `run_worker_first`), handles
# /api/* and /uploads/*, and hands everything else to the static site in web/.
[assets]
directory = "./web"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "gunpla"
database_id = "c112cf2b-4475-4acb-a757-0d846aaada8e"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "gunpla-photos"
